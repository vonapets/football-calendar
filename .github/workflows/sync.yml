name: Sync fixtures

# Runs on GitHub's servers, not on anyone's laptop, so the published page stays
# current whether or not the Mac that built it is switched on.
on:
  schedule:
    - cron: "30 2 * * *"    # 02:30 UTC
    - cron: "30 8 * * *"    # 08:30 UTC
    - cron: "30 14 * * *"   # 14:30 UTC
    - cron: "45 22 * * *"   # 22:45 UTC - after European evening kick-offs finish
  workflow_dispatch:        # and a "Run workflow" button, for when you can't wait

permissions:
  contents: write           # to commit the new snapshot
  pages: write              # to publish
  id-token: write

concurrency:
  group: wallchart
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # sync.py diffs against data/fixtures.json from the previous run, which is
      # why that file is committed: it is this pipeline's memory of yesterday.
      - name: Pull fixtures and rebuild
        run: |
          python sync.py
          python build.py

      - name: Commit the new snapshot
        run: |
          git config user.name  "wallchart bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/fixtures.json data/changes.json
          if git diff --staged --quiet; then
            echo "no fixture changes to record"
          else
            git commit -m "sync $(date -u '+%Y-%m-%d %H:%MZ')"
            git pull --rebase --autostash
            git push
          fi

      - name: Assemble the site
        run: |
          mkdir -p site
          cp calendar.html site/index.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  # Deploys on every run, even when no fixture changed, so the published page can
  # never drift from the latest successful build.
  deploy:
    needs: sync
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
